name: Restore Py'aguapy MVP source
on:
  push:
    paths:
      - '.upload/part4.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extract checked source archive
        run: |
          set -euo pipefail
          cat .upload/part{1,2,3,4}.txt | base64 -d > /tmp/pyaguapy-source.tar.gz
          echo "6ddc544afac283bee2bc19e3cc493da83736433165cd5f73e7f4b4b58e9ee072  /tmp/pyaguapy-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/pyaguapy-source.tar.gz | grep -Ev '(^/|\.\.)'
          tar -xzf /tmp/pyaguapy-source.tar.gz -C .
          rm -rf .upload .github/workflows/restore.yml
          node --test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore complete tested Py'aguapy MVP" || exit 0
          git push origin HEAD:main
